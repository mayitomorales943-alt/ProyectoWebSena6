<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Gestión de Usuarios - Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="">
    <nav class="navbar navbar-dark bg-dark mb-4">
      <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold mb-0" href="admin.html"
          >← Volver a Administración</a
        >
        <div class="d-flex align-items-center">
          <button
            class="btn btn-outline-light btn-sm me-3"
            id="themeToggle"
            title="Cambiar Tema"
            style="
              border-radius: 50%;
              width: 32px;
              height: 32px;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
          </button>
          <span class="navbar-text">Control de Cuentas</span>
        </div>
      </div>
    </nav>
    <div class="container">
      <div class="card shadow-sm border-0 p-4" style="border-radius: 15px">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="fw-bold mb-0">Listado de Usuarios</h4>
          <div class="d-flex gap-2">
            <input
              type="text"
              id="buscador"
              class="form-control form-control-sm"
              placeholder="Buscar usuario..."
              onkeyup="buscarUsuario()"
            />
            <button
              class="btn btn-primary btn-sm px-3"
              data-bs-toggle="modal"
              data-bs-target="#modalUsuario"
              onclick="prepararNuevo()"
            >
              Agregar Nuevo
            </button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>Nombre</th>
                <th>Correo Electrónico</th>
                <th>Rol Asignado</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaCuerpo">
              <tr>
                <td>Maira Morales</td>
                <td>Maira@gmail.com</td>
                <td><span class="badge bg-info text-dark">Docente</span></td>
                <td class="text-center">
                  <button
                    class="btn btn-sm btn-outline-primary me-1"
                    onclick="editarUsuario(this)"
                  >
                    Editar
                  </button>
                  <button
                    class="btn btn-sm btn-outline-danger"
                    onclick="eliminarFila(this)"
                  >
                    Eliminar
                  </button>
                </td>
              </tr>
              <tr>
                <td>Liliana Marcela</td>
                <td>Liliana@gmail.com</td>
                <td>
                  <span class="badge bg-warning text-dark">Administrador</span>
                </td>
                <td class="text-center">
                  <button
                    class="btn btn-sm btn-outline-primary me-1"
                    onclick="editarUsuario(this)"
                  >
                    Editar
                  </button>
                  <button
                    class="btn btn-sm btn-outline-danger"
                    onclick="eliminarFila(this)"
                  >
                    Eliminar
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <div
      class="modal fade"
      id="modalUsuario"
      tabindex="-1"
      aria-labelledby="modalUsuarioLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalUsuarioLabel">
              Datos del Usuario
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="formUsuario">
              <div class="mb-3">
                <label class="form-label">Nombre Completo</label>
                <input
                  type="text"
                  class="form-control"
                  id="nombreInput"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <input
                  type="email"
                  class="form-control"
                  id="correoInput"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Rol</label>
                <select class="form-select" id="rolInput">
                  <option value="Docente">Docente</option>
                  <option value="Administrador">Administrador</option>
                  <option value="Estudiante">Estudiante</option>
                </select>
              </div>
              <button type="submit" class="btn btn-primary w-100">
                Guardar Cambios
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="config.js"></script><script>
      let filaActual = null;
      let usuarioIdEditando = null;
      document.addEventListener("DOMContentLoaded", async () => {
        const token = localStorage.getItem("userToken");
        const rol = localStorage.getItem("userRole");
        if (!token || rol !== "tic") {
          alert("Acceso no autorizado. Redirigiendo...");
          window.location.href = "login.html";
          return;
        }
        await cargarUsuarios();
      });
      async function cargarUsuarios() {
        const token = localStorage.getItem("userToken");
        try {
          const res = await fetch("${API_URL}/api/usuarios", {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (res.ok) {
            const data = await res.json();
            dibujarTabla(data);
          }
        } catch (e) {
          console.error("Error al cargar usuarios", e);
        }
      }
      function dibujarTabla(usuarios) {
        const tbody = document.getElementById("tablaCuerpo");
        tbody.innerHTML = "";
        usuarios.forEach((u) => {
          let badgeClass = "bg-secondary";
          let capRol = u.rol.charAt(0).toUpperCase() + u.rol.slice(1);
          if (u.rol === "docente") badgeClass = "bg-info text-dark";
          if (u.rol === "tic") {
            badgeClass = "bg-warning text-dark";
            capRol = "Administrador";
          }
          if (u.rol === "estudiante") badgeClass = "bg-success";
          const tr = document.createElement("tr");
          tr.setAttribute("data-id", u.id);
          tr.innerHTML = `                    <td class="td-nombre">${u.nombre}</td>                    <td class="td-correo">${u.correo}</td>                    <td class="td-rol" data-valor="${u.rol}"><span class="badge ${badgeClass}">${capRol}</span></td>                    <td class="text-center">                        <button class="btn btn-sm btn-outline-primary me-1" onclick="editarUsuario(${u.id}, this)">Editar</button>                        ${u.rol !== "tic" ? `<button class="btn btn-sm btn-outline-danger" onclick="eliminarFila(${u.id}, this)">Eliminar</button>` : ""}                    </td>                `;
          tbody.appendChild(tr);
        });
      }
      async function eliminarFila(id, boton) {
        if (
          confirm("¿Estás seguro de eliminar permanentemente a este usuario?")
        ) {
          const token = localStorage.getItem("userToken");
          try {
            const res = await fetch(
              `${API_URL}/api/usuarios/${id}`,
              {
                method: "DELETE",
                headers: { Authorization: `Bearer ${token}` },
              },
            );
            if (res.ok) {
              boton.closest("tr").remove();
              Swal.fire({
                toast: true,
                position: "top-end",
                showConfirmButton: false,
                timer: 3000,
                icon: "success",
                title: "Usuario eliminado",
              });
            } else {
              alert("Error eliminando cuenta.");
            }
          } catch (e) {
            console.error(e);
          }
        }
      }
      function prepararNuevo() {
        alert(
          "Para agregar nuevos estudiantes debes usar el Login y Registrarse como plataforma. Esta función está desactivada por ahora.",
        );
        var modalEl = document.getElementById("modalUsuario");
        var modal =
          bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
        modal.hide();
      }
      function editarUsuario(id, boton) {
        filaActual = boton.closest("tr");
        usuarioIdEditando = id;
        document.getElementById("nombreInput").value =
          filaActual.querySelector(".td-nombre").innerText;
        document.getElementById("correoInput").value =
          filaActual.querySelector(".td-correo").innerText;
        let currentRol = filaActual
          .querySelector(".td-rol")
          .getAttribute("data-valor");
        if (currentRol === "tic") currentRol = "Administrador";
        const options = document.getElementById("rolInput").options;
        for (let opt of options) {
          if (opt.value.toLowerCase() === currentRol.toLowerCase()) {
            opt.selected = true;
            break;
          }
        }
        document.getElementById("modalUsuarioLabel").innerText =
          "Editar Usuario";
        var myModal = new bootstrap.Modal(
          document.getElementById("modalUsuario"),
        );
        myModal.show();
      }
      document
        .getElementById("formUsuario")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const nombre = document.getElementById("nombreInput").value;
          const correo = document.getElementById("correoInput").value;
          let rolVal = document.getElementById("rolInput").value.toLowerCase();
          if (rolVal === "administrador") rolVal = "tic";
          if (usuarioIdEditando) {
            const token = localStorage.getItem("userToken");
            try {
              const res = await fetch(
                `${API_URL}/api/usuarios/${usuarioIdEditando}`,
                {
                  method: "PUT",
                  headers: {
                    Authorization: `Bearer ${token}`,
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({ nombre, correo, rol: rolVal }),
                },
              );
              if (res.ok) {
                Swal.fire({
                  toast: true,
                  position: "top-end",
                  showConfirmButton: false,
                  timer: 3000,
                  icon: "success",
                  title: "Cuenta Modificada",
                });
                cargarUsuarios();
              } else {
                Swal.fire("Error", "No se pudo actualizar.", "error");
              }
            } catch (e) {
              console.error(e);
            }
          }
          var modalEl = document.getElementById("modalUsuario");
          var modal = bootstrap.Modal.getInstance(modalEl);
          modal.hide();
        });
      function buscarUsuario() {
        const filtro = document.getElementById("buscador").value.toLowerCase();
        const filas = document
          .getElementById("tablaCuerpo")
          .getElementsByTagName("tr");
        for (let i = 0; i < filas.length; i++) {
          const texto = filas[i].innerText.toLowerCase();
          if (texto.includes(filtro)) {
            filas[i].style.display = "";
          } else {
            filas[i].style.display = "none";
          }
        }
      }
    </script>
    <script src="config.js"></script><script src="script.js"></script>
  </body>
</html>
