<!DOCTYPE html><html lang="es"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Mi Perfil - Repositorio Educativo</title>    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">    <link rel="stylesheet" href="style.css"> <style> .profile-header {            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);            height: 120px;            border-radius: 10px 10px 0 0;        }        .profile-img {            width: 120px;            height: 120px;            object-fit: cover;            border: 4px solid white;            border-radius: 50%;            margin-top: -60px;            background-color: #fff;        }        .resource-card:hover {            transform: translateY(-3px);            transition: all 0.3s ease;            box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .15) !important;        }    </style></head><body>    <nav class="navbar navbar-dark bg-dark shadow-sm p-3 mb-4">        <div class="container">            <a class="navbar-brand fw-bold" href="dashboard.html"><i class="bi bi-arrow-left me-2"></i>Volver al                Panel</a>            <div class="d-flex align-items-center">
                <button class="btn btn-outline-light btn-sm me-2" id="themeToggle" title="Cambiar Tema" style="border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;">
                    <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                </button>
                <a href="login.html" class="btn btn-outline-danger btn-sm fw-bold border-0" onclick="cerrarSesion()">Cerrar
                    Sesión</a>
            </div>        </div>    </nav>    <div class="container">        <div class="row g-4">            <div class="col-lg-4">                <div class="card shadow-sm border-0 rounded-4">                    <div class="profile-header"></div>                    <div class="card-body text-center pb-4">                        <img src="https://ui-avatars.com/api/?name=Usuario&background=0D8ABC&color=fff&size=128"                            alt="Perfil" id="imgPerfil" class="profile-img shadow-sm mb-3">                        <h4 class="fw-bold mb-1" id="nombrePerfil">Cargando...</h4>                        <p class="text-muted mb-1" id="correoPerfil">usuario@ejemplo.com</p>                        <span class="badge bg-primary px-3 py-2 rounded-pill mb-3" id="rolPerfil">Cargando rol...</span>                        <div                            class="bg-light p-3 rounded-4 mb-4 text-start shadow-sm border border-secondary border-opacity-10">                            <div class="d-flex justify-content-between mb-1">                                <span class="fw-bold fs-6 text-dark"><i class="bi bi-star-fill text-warning me-1"></i>                                    Nivel <span id="nivelText">1</span></span>                                <span class="text-primary fw-bold" id="xpText">0 / 100 XP</span>                            </div>                            <div class="progress mb-2" style="height: 10px;">                                <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary"                                    id="xpBar" role="progressbar" style="width: 0%"></div>                            </div>                            <p class="small text-muted mb-0 text-center"><span id="xpRestante">100</span> XP para el                                siguiente nivel</p>                        </div>                        <div class="d-grid gap-2">                            <button class="btn btn-outline-primary fw-bold" onclick="editarPerfil()">                                <i class="bi bi-pencil-square me-2"></i>Editar Perfil                            </button>                        </div>                    </div>                </div>            </div>            <div class="col-lg-8">                <div class="card shadow-sm border-0 rounded-4 h-100">                    <div class="card-body p-4">                        <h5 class="fw-bold mb-4 border-bottom pb-2">                            <i class="bi bi-bookmark-star text-warning me-2"></i>Mis Recursos Guardados                        </h5>                        <div class="row g-3">                            <div class="col-md-6">                                <div class="card h-100 border-light shadow-sm resource-card cursor-pointer">                                    <div class="card-body">                                        <div class="d-flex justify-content-between mb-2">                                            <span class="badge bg-success">Frontend</span>                                            <i class="bi bi-bookmark-fill text-primary"></i>                                        </div>                                        <h6 class="fw-bold">Desarrollo Web con HTML y CSS</h6>                                        <p class="text-muted small mb-0">Guardado el 15 de abril</p>                                    </div>                                </div>                            </div>                            <div class="col-md-6">                                <div class="card h-100 border-light shadow-sm resource-card cursor-pointer">                                    <div class="card-body">                                        <div class="d-flex justify-content-between mb-2">                                            <span class="badge bg-warning text-dark">Backend</span>                                            <i class="bi bi-bookmark-fill text-primary"></i>                                        </div>                                        <h6 class="fw-bold">Introducción a Python</h6>                                        <p class="text-muted small mb-0">Guardado el 10 de abril</p>                                    </div>                                </div>                            </div>                        </div>                    </div>                </div>            </div>        </div>    </div>    <script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>    <script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>    <script src="config.js"></script><script>        document.addEventListener('DOMContentLoaded', async () => {            const token = localStorage.getItem('userToken');            if (!token) {                window.location.href = "login.html";                return;            }            try {                const res = await fetch('${API_URL}/api/perfil', {                    headers: { 'Authorization': `Bearer ${token}` }                });                if (res.ok) {                    const data = await res.json();                    let rolFormateado = data.rol === 'tic' ? 'Administrador (TIC)' : data.rol.charAt(0).toUpperCase() + data.rol.slice(1).toLowerCase();                    document.getElementById('nombrePerfil').innerText = data.nombre;                    document.getElementById('correoPerfil').innerText = data.correo;                    document.getElementById('rolPerfil').innerText = rolFormateado;                    document.getElementById('imgPerfil').src = `https://ui-avatars.com/api/?name=${data.nombre.replace(' ', '+')}&background=0d6efd&color=fff&size=128`;                    const nivel = data.nivel || 1;                    const xp = data.xp || 0;                    const xpSiguienteNivel = nivel * 100;                    const xpBaseNivelAnterior = (nivel - 1) * 100;                    const xpReciente = xp - xpBaseNivelAnterior;                    const meta = xpSiguienteNivel - xpBaseNivelAnterior;                    const porcentaje = (xpReciente / meta) * 100;                    document.getElementById('nivelText').innerText = nivel;                    document.getElementById('xpText').innerText = `${xp} / ${xpSiguienteNivel} XP`;                    document.getElementById('xpBar').style.width = `${porcentaje}%`;                    document.getElementById('xpRestante').innerText = (xpSiguienteNivel - xp);                }            } catch (e) {                console.error("Error al cargar perfil", e);            }        });        function editarPerfil() {            Swal.fire({                title: 'Editar Perfil',                text: 'Esta función estará conectada a la base de datos próximamente.',                icon: 'info',                confirmButtonColor: '#0d6efd'            });        }        function cerrarSesion() {            localStorage.clear();            window.location.href = "login.html";        }    </script>    <script src="config.js"></script><script src="script.js"></script></body></html>
