<!DOCTYPE html>
<html lang="es">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <title>Salón de la Fama - Repositorio Educativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
        }
        .podium-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 250px;
            margin-bottom: 2rem;
        }
        .podium-spot {
            width: 30%;
            text-align: center;
            border-radius: 12px 12px 0 0;
            padding: 1rem;
            color: white;
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        .podium-1 {
            background: linear-gradient(135deg, #ffd700, #daa520);
            height: 230px;
            z-index: 3;
        }
        .podium-2 {
            background: linear-gradient(135deg, #e0e0e0, #9e9e9e);
            height: 180px;
            z-index: 2;
        }
        .podium-3 {
            background: linear-gradient(135deg, #cd7f32, #a0522d);
            height: 140px;
            z-index: 1;
        }
        .avatar-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid white;
            background: #fff;
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }
        .medal-icon {
            font-size: 2rem;
            margin-top: 30px;
            display: block;
        }
        .rank-list-item {
            transition: all 0.3s;
        }
        .rank-list-item:hover {
            transform: translateX(5px);
            background: white;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark shadow-sm p-3 mb-5">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold mb-0" href="dashboard.html">
                <i class="bi bi-arrow-left me-2"></i>Volver al Dashboard
            </a>
            <div class="d-flex align-items-center">
                <button class="btn btn-outline-light btn-sm me-3" id="themeToggle" title="Cambiar Tema" style="border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;">
                    <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                </button>
                <span class="text-light fw-bold"><i class="bi bi-trophy-fill text-warning me-2"></i>Salón de la Fama</span>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="text-center mb-5">
            <h1 class="fw-bold text-dark display-5">🏆 Mejores Estudiantes</h1>
            <p class="text-muted">Los líderes de nuestra plataforma educativa. ¿Puedes superarlos?</p>
        </div>
        <div class="podium-container" id="podiumContainer" style="display: none;">
            <div class="podium-spot podium-2 mx-1" id="podio2">
                <img src="" class="avatar-circle" id="av2">
                <span class="medal-icon">🥈</span>
                <h5 class="fw-bold mt-2 mb-0 text-truncate" id="nombre2">...</h5>
                <small>Nivel <span id="nivel2">0</span></small>
                <h4 class="fw-bold mt-2" id="xp2">0 XP</h4>
            </div>
            <div class="podium-spot podium-1 mx-1 mx-md-3" id="podio1">
                <img src="" class="avatar-circle" id="av1">
                <span class="medal-icon"><i class="bi bi-trophy-fill text-white"></i></span>
                <h4 class="fw-bold mt-2 mb-0 text-truncate" id="nombre1">...</h4>
                <small>Nivel <span id="nivel1">0</span></small>
                <h3 class="fw-bold mt-2 text-white" id="xp1">0 XP</h3>
            </div>
            <div class="podium-spot podium-3 mx-1" id="podio3">
                <img src="" class="avatar-circle" id="av3">
                <span class="medal-icon">🥉</span>
                <h6 class="fw-bold mt-2 mb-0 text-truncate" id="nombre3">...</h6>
                <small>Nivel <span id="nivel3">0</span></small>
                <h5 class="fw-bold mt-2" id="xp3">0 XP</h5>
            </div>
        </div>
        <div class="card shadow-sm border-0 rounded-4 mx-auto" style="max-width: 800px;">
            <div class="card-body p-0">
                <ul class="list-group list-group-flush rounded-4 overflow-hidden" id="rankingList">
                    <li class="list-group-item p-4 text-center text-muted">Obteniendo clasificaciones...</li>
                </ul>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('userToken');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            try {
                const res = await fetch(`${API_URL}/api/ranking`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const ranking = await res.json();
                    renderRanking(ranking);
                }
            } catch (e) {
                console.error('Error', e);
                document.getElementById('rankingList').innerHTML = '<li class="list-group-item p-4 text-center text-danger">Error cargando podio</li>';
            }
        });
        function getAvatarUrl(name) {
            return `https://ui-avatars.com/api/?name=${name.replace(' ', '+')}&background=random&color=fff&size=128`;
        }
        function renderRanking(users) {
            if (users.length === 0) {
                document.getElementById('rankingList').innerHTML = '<li class="list-group-item p-4 text-center text-muted">Nadie ha ganado puntos aún. ¡Sé el primero!</li>';
                return;
            }
            if (users.length >= 1) { fillPodio(1, users[0]); document.getElementById('podiumContainer').style.display = 'flex'; } else { document.getElementById('podio1').style.opacity = 0; }
            if (users.length >= 2) { fillPodio(2, users[1]); } else { document.getElementById('podio2').style.opacity = 0; }
            if (users.length >= 3) { fillPodio(3, users[2]); } else { document.getElementById('podio3').style.opacity = 0; }
            const list = document.getElementById('rankingList');
            list.innerHTML = '';
            for (let i = 3; i < users.length; i++) {
                const u = users[i];
                let rolB = u.rol === 'docente' ? '<i class="bi bi-award-fill text-info ms-2" title="Docente"></i>' : '';
                list.innerHTML += `
                    <li class="list-group-item d-flex justify-content-between align-items-center p-3 rank-list-item">
                        <div class="d-flex align-items-center">
                            <span class="fs-4 fw-bold text-muted me-4" style="width: 30px;">#${i + 1}</span>
                            <img src="${getAvatarUrl(u.nombre)}" class="rounded-circle me-3 border" style="width: 45px; height: 45px;">
                            <div>
                                <h6 class="mb-0 fw-bold text-dark">${u.nombre} ${rolB}</h6>
                                <small class="text-muted">Nivel ${u.nivel}</small>
                            </div>
                        </div>
                        <span class="badge bg-primary rounded-pill px-3 py-2 fs-6">${u.xp} XP</span>
                    </li>
                `;
            }
        }
        function fillPodio(pos, user) {
            document.getElementById(`av${pos}`).src = getAvatarUrl(user.nombre);
            document.getElementById(`nombre${pos}`).innerText = user.nombre;
            document.getElementById(`nivel${pos}`).innerText = user.nivel;
            document.getElementById(`xp${pos}`).innerText = `${user.xp} XP`;
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
