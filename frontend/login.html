<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Repositorio Educativo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .login-card {
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            background-color: white;
        }

        .login-image {
            background-image: url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=800&q=80');
            background-size: cover;
            background-position: center;
            min-height: 100%;
        }

        .hover-primary {
            transition: color 0.2s ease-in-out;
        }

        .hover-primary:hover {
            color: #0d6efd !important;
        }
    </style>
</head>

<body>

    <div class="container vh-100 d-flex justify-content-center align-items-center py-5">

        <div class="card login-card w-100 border-0" style="max-width: 1000px;">
            <div class="row g-0 h-100">

                <div class="col-md-5 d-none d-md-block login-image">
                </div>

                <div class="col-md-7 d-flex align-items-center bg-white">
                    <div class="card-body p-4 p-lg-5 text-black">

                        <form id="loginForm">

                            <div class="d-flex align-items-center mb-4 pb-1">
                                <a href="inicio.html" class="text-decoration-none text-muted me-3 fs-5 hover-primary"
                                    title="Volver al inicio">
                                    <i class="bi bi-arrow-left-circle-fill"></i>
                                </a>
                                <span class="h3 fw-bold mb-0 text-primary">¡Bienvenido!</span>
                            </div>

                            <h5 class="fw-normal mb-4 pb-2 text-muted">Ingresa a tu cuenta en el Repositorio</h5>

                            <div class="form-floating mb-4">
                                <input type="email" id="emailInput" class="form-control"
                                    placeholder="correo@ejemplo.com" required />
                                <label for="emailInput"><i class="bi bi-envelope me-2"></i>Correo electrónico</label>
                            </div>

                            <div class="form-floating mb-4">
                                <input type="password" id="passwordInput" class="form-control" placeholder="Contraseña"
                                    required />
                                <label for="passwordInput"><i class="bi bi-lock me-2"></i>Contraseña</label>
                            </div>

                            <div class="pt-1 mb-4">
                                <button class="btn btn-primary btn-lg w-100 fw-bold shadow-sm" type="button"
                                    onclick="iniciarSesion()">Iniciar Sesión</button>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a class="small text-muted text-decoration-none hover-primary"
                                    href="recuperar.html">¿Olvidaste tu contraseña?</a>
                                <a class="small text-primary fw-bold text-decoration-none" href="index.html">Regístrate
                                    aquí</a>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="config.js"></script><script>
        async function iniciarSesion() {
            const correo = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;

            if (!correo || !password) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Campos incompletos',
                    text: 'Por favor ingresa tu correo y contraseña.',
                    confirmButtonColor: '#0d6efd'
                });
                return;
            }

            try {
                const respuesta = await fetch('${API_URL}/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        correo: correo,
                        password: password
                    })
                });

                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Acceso Denegado',
                        text: datos.error || 'Correo o contraseña incorrectos.',
                        confirmButtonColor: '#dc3545'
                    });
                    return;
                }

                localStorage.setItem('userToken', datos.token);
                localStorage.setItem('userRole', datos.rol);
                localStorage.setItem('userName', datos.nombre);

                Swal.fire({
                    icon: 'success',
                    title: `¡Hola, ${datos.nombre}!`,
                    text: 'Has iniciado sesión correctamente.',
                    confirmButtonColor: '#0d6efd',
                    timer: 2000,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = 'dashboard.html';
                });

            } catch (error) {
                console.error('Error de conexión:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error de Servidor',
                    text: 'No se pudo conectar con la base de datos.',
                    confirmButtonColor: '#dc3545'
                });
            }
        }
    </script>

    <script src="config.js"></script><script src="login-script.js"></script>

</body>

</html>
