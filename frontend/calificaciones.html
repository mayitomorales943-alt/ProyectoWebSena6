<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Calificaciones</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        min-height: 100vh;
        padding: 40px 0;
      }
      .glass-panel {
        background: var(--bs-tertiary-bg);
        backdrop-filter: blur(15px);
        border: 1px solid var(--bs-border-color);
        border-radius: 20px;
        padding: 30px;
      }
      .table {
        color: white;
      }
      .star-gold {
        color: #ffcc00;
      }
    </style>
  </head>
  <body class="bg-branded">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">
          <i class="bi bi-star-fill me-2 text-warning"></i>Gestión de
          Calificaciones
        </h2>
        <div class="d-flex align-items-center">
          <button
            class="btn btn-outline-light btn-sm me-3"
            id="themeToggle"
            title="Cambiar Tema"
            style="
              border-radius: 50%;
              width: 40px;
              height: 40px;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <i class="bi bi-moon-stars-fill fs-5" id="themeIcon"></i>
          </button>
          <a href="admin.html" class="btn btn-outline-light rounded-pill px-4"
            ><i class="bi bi-arrow-left me-2"></i>Volver al Panel</a
          >
        </div>
      </div>
      <div class="glass-panel shadow-lg">
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr class="opacity-75">
                <th>Usuario</th>
                <th>Recurso</th>
                <th>Reseña</th>
                <th>Comentario</th>
                <th>Fecha</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="listaCalificaciones">
              <tr>
                <td colspan="6" class="text-center py-4">
                  <div class="spinner-border text-light" role="status"></div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="config.js"></script><script>
      document.addEventListener("DOMContentLoaded", () => {
        const token = localStorage.getItem("userToken");
        const rol = localStorage.getItem("userRole");
        if (!token || rol !== "tic") {
          window.location.href = "dashboard.html";
          return;
        }
        cargarCalificaciones();
      });
      async function cargarCalificaciones() {
        const token = localStorage.getItem("userToken");
        try {
          const res = await fetch("${API_URL}/api/calificaciones", {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (res.ok) {
            const data = await res.json();
            const tbody = document.getElementById("listaCalificaciones");
            if (data.length === 0) {
              tbody.innerHTML =
                '<tr><td colspan="6" class="text-center py-4">No hay reseñas aún.</td></tr>';
              return;
            }
            tbody.innerHTML = data
              .map((c) => {
                let estrellasHtml = "";
                for (let i = 0; i < 5; i++) {
                  if (i < c.estrellas)
                    estrellasHtml +=
                      '<i class="bi bi-star-fill star-gold"></i>';
                  else
                    estrellasHtml +=
                      '<i class="bi bi-star text-secondary"></i>';
                }
                let fecha = new Date(c.creado_en).toLocaleString();
                return `
                        <tr>
                            <td class="fw-bold">${c.nombre}<br><small class="text-light opacity-50">${c.correo}</small></td>
                            <td><span class="badge bg-primary text-wrap" style="max-width: 15rem;">${c.recurso_titulo}</span></td>
                            <td>${estrellasHtml}</td>
                            <td class="fst-italic" style="max-width: 250px;">"${c.comentario || "Sin comentario"}"</td>
                            <td class="small opacity-75">${fecha}</td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-danger" onclick="eliminarCalificacion(${c.id})" title="Eliminar Reseña">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                        `;
              })
              .join("");
          }
        } catch (e) {
          console.error("Error", e);
        }
      }
      async function eliminarCalificacion(id) {
        const token = localStorage.getItem("userToken");
        const result = await Swal.fire({
          title: "¿Estás seguro?",
          text: "Esta reseña será eliminada permanentemente.",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#d33",
          cancelButtonColor: "#3085d6",
          confirmButtonText: "Sí, borrar",
          cancelButtonText: "Cancelar",
        });
        if (result.isConfirmed) {
          try {
            const res = await fetch(
              `${API_URL}/api/calificaciones/${id}`,
              {
                method: "DELETE",
                headers: { Authorization: `Bearer ${token}` },
              },
            );
            if (res.ok) {
              Swal.fire("¡Eliminado!", "La reseña fue borrada.", "success");
              cargarCalificaciones();
            }
          } catch (e) {
            console.error("Error al borrar", e);
          }
        }
      }
    </script>
    <script src="config.js"></script><script src="script.js"></script>
  </body>
</html>
