<!DOCTYPE html>
<html lang="es">

<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Proyecto TIC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .register-card {
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            background-color: white;
        }

        .register-image {
            background-image: url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=800&q=80');
            background-size: cover;
            background-position: center;
            min-height: 100%;
        }

        .hover-primary {
            transition: color 0.2s ease-in-out;
        }

        .hover-primary:hover {
            color: #0d6efd !important;
        }
    </style>
</head>

<body>

    <div class="container vh-100 d-flex justify-content-center align-items-center py-5">

        <div class="card register-card w-100 border-0" style="max-width: 1000px;">
            <div class="row g-0 h-100">

                <div class="col-md-5 d-none d-md-block register-image">
                </div>

                <div class="col-md-7 d-flex align-items-center bg-white">
                    <div class="card-body p-4 p-lg-5 text-black">

                        <form id="formRegistro">

                            <div class="d-flex align-items-center mb-4 pb-1">
                                <a href="registro.html" class="text-decoration-none text-muted me-3 fs-5 hover-primary"
                                    title="Volver al inicio">
                                    <i class="bi bi-arrow-left-circle-fill"></i>
                                </a>
                                <span class="h3 fw-bold mb-0 text-primary">¡Inscríbete!</span>
                            </div>

                            <h5 class="fw-normal mb-4 pb-2 text-muted">Crea tu cuenta en el Repositorio</h5>

                            <div class="row">
                                <div class="col-md-7 mb-4">
                                    <div class="form-floating">
                                        <input type="text" id="nombreInput" class="form-control"
                                            placeholder="Nombre Completo" required />
                                        <label for="nombreInput"><i class="bi bi-person me-2"></i>Nombre
                                            completo</label>
                                    </div>
                                </div>
                                <div class="col-md-5 mb-4">
                                    <div class="form-floating">
                                        <select class="form-select" id="rolSelect" required>
                                            <option value="" disabled selected>Selecciona...</option>
                                            <option value="estudiante">Estudiante</option>
                                            <option value="docente">Docente</option>
                                            <option value="tic">Personal TIC</option>
                                        </select>
                                        <label for="rolSelect"><i class="bi bi-person-badge me-2"></i>Rol</label>
                                    </div>
                                </div>
                            </div>

                            <div class="form-floating mb-4">
                                <input type="email" id="emailInput" class="form-control"
                                    placeholder="Correo Institucional" required />
                                <label for="emailInput"><i class="bi bi-envelope me-2"></i>Correo Institucional</label>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-4">
                                    <div class="form-floating">
                                        <input type="password" id="p1" class="form-control" placeholder="Contraseña"
                                            required />
                                        <label for="p1"><i class="bi bi-lock me-2"></i>Contraseña</label>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <div class="form-floating">
                                        <input type="password" id="p2" class="form-control"
                                            placeholder="Repite Contraseña" required />
                                        <label for="p2"><i class="bi bi-lock-fill me-2"></i>Confirmar Contraseña</label>
                                    </div>
                                </div>
                            </div>

                            <div class="pt-1 mb-4">
                                <button class="btn btn-primary btn-lg w-100 fw-bold shadow-sm" type="submit">Completar
                                    Registro</button>
                            </div>

                            <div class="text-center">
                                <p class="mb-0 text-muted">¿Ya eres parte? <a href="login.html"
                                        class="text-primary fw-bold text-decoration-none">Entra aquí</a></p>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        document.getElementById('formRegistro').addEventListener('submit', async function (e) {
            e.preventDefault();

            const nombre = document.getElementById('nombreInput').value;
            const correo = document.getElementById('emailInput').value;
            const p1 = document.getElementById('p1').value;
            const p2 = document.getElementById('p2').value;
            const rol = document.getElementById('rolSelect').value;

            if (p1 !== p2) {
                Swal.fire({
                    icon: 'error',
                    title: 'Contraseñas diferentes',
                    text: 'Las contraseñas no coinciden. Por favor, verifica.',
                    confirmButtonColor: '#0d6efd'
                });
                return;
            }

            try {
                const respuesta = await fetch(`${API_URL}/api/registro`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nombre: nombre,
                        correo: correo,
                        password: p1,
                        rol: rol
                    })
                });

                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    Swal.fire({
                        icon: 'error',
                        title: 'No se pudo registrar',
                        text: datos.error || 'Ocurrió un error inesperado.',
                        confirmButtonColor: '#dc3545'
                    });
                    return;
                }

                localStorage.setItem('userRole', rol);

                Swal.fire({
                    icon: 'success',
                    title: '¡Registro Exitoso!',
                    text: 'Tu usuario ya está registardo con exito.',
                    confirmButtonColor: '#0d6efd'
                }).then((result) => {
                    if (result.isConfirmed) {
                        window.location.href = 'login.html';
                    }
                });

            } catch (error) {
                console.error('Error de conexión:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error de Servidor',
                    text: 'No se pudo conectar con la base de datos. Verifica que el servidor esté encendido.',
                    confirmButtonColor: '#dc3545'
                });
            }
        });
    </script>

</body>

</html>
